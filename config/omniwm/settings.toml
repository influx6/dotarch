# OmniWM configuration
# https://omniwm.app — a Niri-style tiling window manager for macOS.
#
# This file is read from $XDG_CONFIG_HOME/omniwm/settings.toml (i.e.
# ~/.config/omniwm/settings.toml). The macOS installer symlinks it here.
# It is a COMPLETE, schema-versioned snapshot (schemaVersion below): OmniWM
# decodes every table as required and rejects a partial file, so do not strip
# sections out. It live-reloads on save; the Settings GUI rewrites it in place.
#
# Deviations from OmniWM's defaults (everything else is stock):
#   * gaps: 12px inner + outer, mirroring the old yabai padding.
#   * general.ipcEnabled = true, so `omniwmctl` (and, if ever needed, skhd)
#     can drive OmniWM for anything the internal keybinding manager can't do.
#   * hotkeys: vim-style alt+h/j/k/l focus and the rest of the yabai muscle
#     memory mapped onto OmniWM action ids.
#   * appRules: the old yabai `manage=off` rules translated to `float`.

schemaVersion = 4

# --- monitor overrides (empty — OmniWM's defaults) ---------------------------
monitorBarOverrides = []
monitorOrientationOverrides = []
monitorNiriOverrides = []
monitorDwindleOverrides = []
monitorGapOverrides = []

[general]
hotkeysEnabled = true
systemHyperTrigger = "None"
hyperKeyModifiers = "Control+Option+Shift+Command"
defaultLayoutType = "niri"
preventSleepEnabled = false
updateChecksEnabled = true
ipcEnabled = true
animationsEnabled = true
animationSpeed = 1.0

[focus]
followsMouse = false
raiseOnMouseFocus = false
lockModifier = "off"
moveMouseToFocusedWindow = false
followsWindowToMonitor = false
crossesMonitorAtEdge = false
moveCrossesMonitorAtEdge = false

[mouseWarp]
margin = 1
enabled = true
constrainToArrangement = false

[routing]
mode = "macOS"
arrangements = []

[gaps]
# 12px on all sides mirrors the old yabai top/bottom/left/right_padding + gap.
size = 12.0
fullscreenUsesOuterGaps = false
[gaps.outer]
left = 12.0
right = 12.0
top = 12.0
bottom = 12.0

[niri]
visibleContainerCount = 2
infiniteLoop = false
centerFocusedColumn = "never"
alwaysCenterSingleColumn = false
singleWindowFit = "fill"
containerPrimarySpanPresets = [0.3333, 0.5, 0.6667]
defaultContainerPrimarySpan = 0.5
edgeGaps = true
resizeStepPercent = 5

[dwindle]
smartSplit = false
defaultSplitRatio = 1.0
splitWidthMultiplier = 1.0
singleWindowFit = "fill"
useGlobalGaps = true
moveToRootStable = true

[borders]
enabled = true
width = 5.0
color = { red = 0.084585202284378935, green = 1.0, blue = 0.97930003794467602, alpha = 1.0 }

[overview]
enabled = true
zoom = 1.0
backdrop = { red = 0.05, green = 0.05, blue = 0.08, alpha = 0.0 }
matchFocusBorder = true
invertScrollDirection = false
mouseScrollSpeed = 1.0
[overview.windowBorders]
normal = { red = 0.3, green = 0.3, blue = 0.35, alpha = 0.5 }
hovered = { red = 0.4, green = 0.6, blue = 1.0, alpha = 1.0 }
selected = { red = 0.3, green = 0.8, blue = 0.4, alpha = 1.0 }

[workspaceBar]
enabled = true
hoverPreviewsEnabled = true
notificationBadges = "off"
notificationBadgeRefreshIntervalSeconds = 5.0
showLabels = true
showFloatingWindows = false
windowLevel = "popup"
position = "overlappingMenuBar"
notchMode = "moveBelowMenuBar"
notchActiveZoneWidth = 180.0
fullWidth = false
fullWidthNotchMode = "rightOfNotch"
systemStatsButton = false
deduplicateAppIcons = false
hideEmptyWorkspaces = false
excludedBundleIDs = []
iconOverrides = {}
reserveLayoutSpace = false
autoHide = false
autoHideRevealDelayMilliseconds = 0.0
autoHideHideDelayMilliseconds = 0.0
revealModifier = "off"
revealHoldMilliseconds = 200.0
hideInNativeFullscreen = false
height = 24.0
backgroundOpacity = 0.1
transparentBackground = false
solidBlackBackground = false
showItemBackgrounds = true
showAccentHighlights = true
xOffset = 0.0
yOffset = 0.0

[island]
enabled = false

[gestures]
scrollEnabled = true
scrollSensitivity = 5.0
scrollModifierKey = "optionShift"
mouseMoveModifierKey = "option"
mouseResizeModifierKey = "option"
fingerCount = 3
invertDirection = true
trackpadScrollStyle = "snap"
workspaceSwipeEnabled = false
workspaceSwipeFingerCount = 3
workspaceSwipeAxis = "vertical"
overviewGestureEnabled = false
overviewGestureFingerCount = 4
windowMoveEnabled = false
windowMoveFingerCount = 4
windowResizeEnabled = false
windowResizeFingerCount = 3
windowGestureSensitivity = 1.0

[statusBar]
showWorkspaceName = false
showAppNames = false
useWorkspaceId = false
showIcon = true

[hiddenBar]
enabled = true
hiddenBundleIDs = []
rehideIntervalSeconds = 5.0

[clipboard]
historyEnabled = false
maxItems = 200
maxItemBytes = 8388608
maxTotalBytes = 67108864
ignoredTypes = []

[quakeTerminal]
enabled = true
position = "center"
widthPercent = 50.0
heightPercent = 50.0
animationDuration = 0.2
autoHide = false
opacity = 1.0
backgroundEffect = "standardBlur"
backgroundBlurRadius = 0
monitorMode = "focusedWindow"

[scratchpads]
labels = {}

[appearance]
mode = "dark"
tabRailAppIcons = false

# --- keybindings -------------------------------------------------------------
# The `hotkeys` array is the complete set of active bindings: every action not
# listed here is unassigned. Key names are human-readable (H, 1, Equal, Minus,
# Grave, Tab, Space), modifiers in Control+Option+Shift+Command order.
#
# alt (option) is the leader, mirroring the old skhd/yabai config:
#   alt+h/j/k/l     focus west/south/north/east
#   alt+s/g         focus previous/next display
#   shift+alt+…     swap/move windows, move to space, float/fullscreen
#   ctrl+alt+…      warp columns, balance
#   ctrl+…          resize

[[hotkeys]]
id = "focus.left"
binding = "Option+H"

[[hotkeys]]
id = "focus.right"
binding = "Option+L"

[[hotkeys]]
id = "focus.up"
binding = "Option+K"

[[hotkeys]]
id = "focus.down"
binding = "Option+J"

[[hotkeys]]
id = "focusMonitorPrevious"
binding = "Option+S"

[[hotkeys]]
id = "focusMonitorNext"
binding = "Option+G"

[[hotkeys]]
id = "focusMonitorLast"
binding = "Control+Command+Grave"

[[hotkeys]]
id = "focusPrevious"
binding = "Option+Tab"

[[hotkeys]]
